<app-navbar rotaLogo="/home">
    <div *ngIf="tipoUsuario != ''">
        <button class="botao botao-secundario" routerLink="/home" disabled>Perfil</button>
    </div>
</app-navbar>
<main class="conteudo">
    <section>
        <div class="vazio">
            <h2>Bem vindo ao OpenRoute</h2>
            <div *ngIf="tipoUsuario === ''">
                <button class="botao botao-primario" routerLink="/autenticacao">Fazer Login</button>
            </div>
            <div *ngIf="tipoUsuario === 'ADM'">
                <button class="botao botao-primario" routerLink="/painel-adm">Painel do ADM</button>
            </div>
            <div *ngIf="tipoUsuario === 'USUARIO'">
                <button class="botao botao-primario" routerLink="/painel-motorista">Painel do Usuario</button>
            </div>
        </div>
    </section>
</main>
