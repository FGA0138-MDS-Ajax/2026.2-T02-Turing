<app-header/>
<div class="main">
    <div class="tabs">
        <div class="tab" *ngFor="let tab of this.tabsPainel" (click)="alteraPainel(tab.id)">
            <h3 class="tabText">{{tab.label}}</h3>
        </div>
    </div>
    <div class="divider"></div>
    <div class="content">
        <app-painel-destinos *ngIf="this.painelSelecionado === 0"></app-painel-destinos>
        <app-painel-restricoes *ngIf="this.painelSelecionado === 1"></app-painel-restricoes>
    </div>
</div>
